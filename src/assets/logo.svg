<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">
  <defs>
    <!-- Sky gradient inside circle -->
    <radialGradient id="skyG" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="50%" stop-color="#c3dffe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <!-- Building gradients -->
    <linearGradient id="bG1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Circle border gradient -->
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Clip to circle -->
    <clipPath id="cClip">
      <circle cx="110" cy="105" r="96"/>
    </clipPath>
  </defs>

  <!-- ── Outer glow ring ── -->
  <circle cx="110" cy="105" r="102" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>

  <!-- ── Circle background ── -->
  <circle cx="110" cy="105" r="96" fill="url(#skyG)"/>

  <!-- ── Buildings (clipped) ── -->
  <g clip-path="url(#cClip)">

    <!-- Water base -->
    <rect x="14" y="168" width="192" height="40" fill="#60a5fa" opacity="0.25"/>

    <!-- Far buildings (light) -->
    <rect x="20"  y="128" width="12" height="42" rx="1" fill="#3b82f6" opacity="0.4"/>
    <rect x="34"  y="118" width="10" height="52" rx="1" fill="#2563eb" opacity="0.4"/>
    <rect x="174" y="122" width="12" height="48" rx="1" fill="#3b82f6" opacity="0.4"/>
    <rect x="188" y="115" width="10" height="55" rx="1" fill="#2563eb" opacity="0.4"/>

    <!-- Left cluster -->
    <rect x="26"  y="138" width="18" height="32" rx="2" fill="url(#bG1)"/>
    <rect x="46"  y="128" width="14" height="42" rx="2" fill="url(#bG2)"/>

    <!-- Left curved tower -->
    <path d="M64 170 L68 118 Q75 108 82 118 L86 170Z" fill="url(#bG1)"/>
    <path d="M68 148 Q75 143 82 148" stroke="#93c5fd" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M68 136 Q75 131 82 136" stroke="#93c5fd" stroke-width="0.8" fill="none" opacity="0.6"/>

    <!-- ── BURJ KHALIFA (center, tallest) ── -->
    <path d="M100 170 L104 115 L108 55 L110 18 L112 55 L116 115 L120 170Z" fill="url(#bG1)"/>
    <!-- Spire -->
    <rect x="109" y="18" width="2" height="40" rx="1" fill="#3b82f6"/>
    <!-- Setbacks -->
    <rect x="98"  y="125" width="24" height="3" rx="1" fill="#2563eb" opacity="0.7"/>
    <rect x="100" y="108" width="20" height="2" rx="1" fill="#2563eb" opacity="0.6"/>
    <rect x="103" y="88"  width="14" height="2" rx="1" fill="#2563eb" opacity="0.5"/>
    <rect x="105" y="70"  width="10" height="2" rx="1" fill="#2563eb" opacity="0.4"/>
    <!-- Windows -->
    <rect x="106" y="135" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
    <rect x="111" y="135" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
    <rect x="106" y="148" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
    <rect x="111" y="148" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
    <rect x="106" y="160" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
    <rect x="111" y="160" width="3" height="4" rx="0.5" fill="#bfdbfe" opacity="0.9"/>

    <!-- Right curved tower -->
    <path d="M124 170 L128 122 Q135 112 142 122 L146 170Z" fill="url(#bG2)"/>
    <path d="M128 150 Q135 145 142 150" stroke="#93c5fd" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M128 138 Q135 133 142 138" stroke="#93c5fd" stroke-width="0.8" fill="none" opacity="0.6"/>

    <!-- Right cluster -->
    <rect x="148" y="132" width="18" height="38" rx="2" fill="url(#bG1)"/>
    <rect x="168" y="125" width="14" height="45" rx="2" fill="url(#bG2)"/>
    <rect x="184" y="135" width="12" height="35" rx="2" fill="url(#bG1)"/>

    <!-- Water reflection swoosh -->
    <path d="M14 170 Q80 160 110 168 Q140 175 206 165 L206 185 Q140 195 110 188 Q80 180 14 190Z"
      fill="#1e3a8a" opacity="0.18"/>
    <path d="M14 175 Q85 164 110 172 Q135 180 206 170 L206 180 Q135 190 110 182 Q85 174 14 185Z"
      fill="#3b82f6" opacity="0.12"/>
  </g>

  <!-- ── Circle border ── -->
  <circle cx="110" cy="105" r="96" fill="none" stroke="url(#borderG)" stroke-width="4"/>

  <!-- ══════════════════════════════
       TEXT BELOW CIRCLE
  ══════════════════════════════ -->

  <!-- SAI PROPERTIES -->
  <text x="110" y="222"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22" font-weight="700" fill="#1e3a8a"
    text-anchor="middle" letter-spacing="2">SAI PROPERTIES</text>

  <!-- decorative lines + FZ-LLC -->
  <line x1="14"  y1="234" x2="68"  y2="234" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="110" y="239"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13" font-weight="600" fill="#1e3a8a"
    text-anchor="middle" letter-spacing="4">FZ-LLC</text>
  <line x1="152" y1="234" x2="206" y2="234" stroke="#1e3a8a" stroke-width="1.5"/>
</svg>
