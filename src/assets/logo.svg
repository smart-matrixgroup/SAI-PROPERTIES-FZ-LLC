<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">
  <defs>
    <!-- Sky gradient inside circle -->
    <radialGradient id="skyGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="55%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Building gradient -->
    <linearGradient id="bldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Circle border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <!-- Clip circle -->
    <clipPath id="circleClip">
      <circle cx="250" cy="165" r="148"/>
    </clipPath>
    <!-- Wave clip -->
    <clipPath id="waveClip">
      <rect x="102" y="240" width="296" height="80"/>
    </clipPath>
  </defs>

  <!-- ===== CIRCLE BACKGROUND ===== -->
  <circle cx="250" cy="165" r="152" fill="url(#borderGrad)" opacity="0.3"/>
  <circle cx="250" cy="165" r="148" fill="url(#skyGrad)"/>

  <!-- ===== BUILDINGS (clipped to circle) ===== -->
  <g clip-path="url(#circleClip)">

    <!-- Water/reflection base -->
    <ellipse cx="250" cy="268" rx="148" ry="22" fill="url(#waterGrad)" opacity="0.6"/>
    <rect x="102" y="256" width="296" height="30" fill="url(#waterGrad)" opacity="0.5"/>

    <!-- Wave swoosh bottom -->
    <path d="M102 260 Q175 248 250 256 Q325 264 398 252 L398 280 Q325 272 250 280 Q175 288 102 280 Z" fill="#1e40af" opacity="0.35"/>
    <path d="M102 265 Q185 252 260 262 Q335 272 398 258 L398 275 Q335 265 260 275 Q185 285 102 272 Z" fill="#60a5fa" opacity="0.25"/>

    <!-- Far background buildings (lighter) -->
    <rect x="138" y="195" width="18" height="75" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="158" y="180" width="14" height="90" rx="2" fill="#2563eb" opacity="0.5"/>
    <rect x="330" y="188" width="16" height="82" rx="2" fill="#3b82f6" opacity="0.5"/>
    <rect x="348" y="175" width="12" height="95" rx="2" fill="#2563eb" opacity="0.5"/>

    <!-- Left cluster buildings -->
    <rect x="128" y="210" width="22" height="60" rx="3" fill="url(#bldGrad2)"/>
    <rect x="128" y="206" width="22" height="6" rx="1" fill="#60a5fa" opacity="0.4"/>
    <!-- window lines -->
    <rect x="131" y="215" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="137" y="215" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="143" y="215" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="131" y="222" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="137" y="222" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>
    <rect x="143" y="222" width="4" height="3" rx="0.5" fill="#93c5fd" opacity="0.6"/>

    <!-- Twisted/curved tower left -->
    <path d="M158 270 L162 195 Q170 185 178 195 L182 270 Z" fill="url(#bldGrad1)"/>
    <path d="M162 240 Q170 235 178 240" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M162 225 Q170 220 178 225" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M162 210 Q170 205 178 210" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Wide building left-center -->
    <rect x="183" y="200" width="30" height="70" rx="3" fill="url(#bldGrad3)"/>
    <rect x="183" y="195" width="30" height="7" rx="2" fill="#2563eb"/>
    <rect x="195" y="192" width="6" height="6" rx="1" fill="#1e40af"/>
    <!-- windows -->
    <rect x="187" y="207" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="195" y="207" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="203" y="207" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="187" y="216" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="195" y="216" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="203" y="216" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="187" y="225" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="195" y="225" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="203" y="225" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>

    <!-- BURJ KHALIFA (center, tallest) -->
    <!-- Base -->
    <path d="M238 270 L243 175 L248 90 L250 32 L252 90 L257 175 L262 270 Z" fill="url(#bldGrad1)"/>
    <!-- Taper sections -->
    <path d="M240 270 L244 200 L248 130 L250 32 L252 130 L256 200 L260 270 Z" fill="#1e3a8a" opacity="0.3"/>
    <!-- Spire top -->
    <rect x="249" y="32" width="2" height="60" rx="1" fill="#3b82f6"/>
    <!-- Setbacks -->
    <rect x="236" y="200" width="28" height="4" rx="1" fill="#2563eb" opacity="0.6"/>
    <rect x="238" y="180" width="24" height="3" rx="1" fill="#2563eb" opacity="0.5"/>
    <rect x="241" y="155" width="18" height="3" rx="1" fill="#2563eb" opacity="0.4"/>
    <rect x="243" y="130" width="14" height="2" rx="1" fill="#2563eb" opacity="0.3"/>
    <rect x="245" y="105" width="10" height="2" rx="1" fill="#2563eb" opacity="0.3"/>
    <!-- Windows -->
    <rect x="245" y="215" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="252" y="215" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="245" y="230" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="252" y="230" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="245" y="245" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="252" y="245" width="3" height="5" rx="0.5" fill="#bfdbfe" opacity="0.8"/>

    <!-- Right curved tower -->
    <path d="M268 270 L271 190 Q279 178 287 190 L290 270 Z" fill="url(#bldGrad2)"/>
    <path d="M271 240 Q279 233 287 240" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M271 220 Q279 213 287 220" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M271 200 Q279 193 287 200" stroke="#60a5fa" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- Right wide building -->
    <rect x="291" y="205" width="28" height="65" rx="3" fill="url(#bldGrad3)"/>
    <rect x="291" y="200" width="28" height="7" rx="2" fill="#1d4ed8"/>
    <rect x="303" y="196" width="4" height="5" rx="1" fill="#1e3a8a"/>
    <!-- windows -->
    <rect x="295" y="212" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="303" y="212" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="311" y="212" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="295" y="222" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="303" y="222" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="311" y="222" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="295" y="232" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="303" y="232" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>
    <rect x="311" y="232" width="5" height="4" rx="0.5" fill="#bfdbfe" opacity="0.7"/>

    <!-- Right cluster -->
    <rect x="322" y="215" width="20" height="55" rx="3" fill="url(#bldGrad1)"/>
    <rect x="344" y="225" width="16" height="45" rx="3" fill="url(#bldGrad2)"/>
    <rect x="362" y="218" width="14" height="52" rx="3" fill="url(#bldGrad3)"/>

    <!-- Water reflection of Burj (mirror blur) -->
    <path d="M242 270 L244 285 L250 295 L256 285 L258 270 Z" fill="#1e40af" opacity="0.25"/>
    <path d="M236 270 L238 280 L242 285 L248 290 L252 290 L258 285 L262 280 L264 270 Z" fill="#3b82f6" opacity="0.15"/>

    <!-- Swoosh waves at bottom of circle -->
    <path d="M102 265 Q165 252 220 262 Q270 270 330 255 Q360 248 398 258 L398 290 L102 290 Z" fill="#1e3a8a" opacity="0.2"/>
    <path d="M102 272 Q170 258 240 270 Q300 280 398 264 L398 290 L102 290 Z" fill="#2563eb" opacity="0.15"/>

  </g>

  <!-- ===== CIRCLE BORDER ===== -->
  <circle cx="250" cy="165" r="148" fill="none" stroke="url(#borderGrad)" stroke-width="5"/>
  <!-- Inner glow ring -->
  <circle cx="250" cy="165" r="152" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== TEXT BELOW ===== -->
  <!-- SAI PROPERTIES -->
  <text x="250" y="358"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="700"
    fill="#1e3a8a"
    text-anchor="middle"
    letter-spacing="3">SAI PROPERTIES</text>

  <!-- Decorative lines + FZ-LLC -->
  <line x1="102" y1="375" x2="185" y2="375" stroke="#1e3a8a" stroke-width="2"/>
  <text x="250" y="382"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="600"
    fill="#1e3a8a"
    text-anchor="middle"
    letter-spacing="6">FZ-LLC</text>
  <line x1="315" y1="375" x2="398" y2="375" stroke="#1e3a8a" stroke-width="2"/>

</svg>
